<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Experience</title>
    <style>
        body {
            background-color: #ffcccb;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .heart {
            color: red;
            font-size: 50px;
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <h1>Welcome to the Enhanced Valentine's Day Experience!</h1>
    <div class="heart">❤️</div>
    <h2>Interactive Features:</h2>
    <p>Enjoy animations, particle effects, sound effects, mini-games, and Easter eggs!</p>
    <script>
        // Example of a simple interactive animation
        document.querySelector('.heart').addEventListener('click', function() {
            alert('Happy Valentine’s Day! 🎉');
        });

        // Add more complex interactions and animations
        // ...
    </script>
</body>
</html>
