<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Be My Valentine?</title>
  <style>
    :root {
      --bg-dark: #0f0014;
      --bg-purple: #24001f;
      --gold: #ffd166;
      --pink: #ff6fb5;
      --rose: #ff2d75;
      --cream: #fff4e6;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden; /* Prevent scroll */
      font-family: "Poppins", system-ui, sans-serif;
      color: var(--cream);
      background: radial-gradient(circle at 50% 120%, #4a0056 0%, var(--bg-dark) 60%, #000 100%);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Background Animation Layers */
    .canvas-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    
    #fireworks { opacity: 0.5; }
    #confetti { z-index: 10; }

    .balloon-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Balloons */
    .balloon {
      position: absolute;
      width: 40px;
      height: 52px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1), 2px 5px 10px rgba(0,0,0,0.1);
      animation: floatUp linear infinite;
      will-change: transform;
    }

    .balloon::before {
      content: "";
      position: absolute;
      top: 10%; left: 15%;
      width: 8px; height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: rotate(45deg);
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%; bottom: -12px;
      width: 1px; height: 40px;
      background: rgba(255,255,255,0.4);
    }

    @keyframes floatUp {
      from { transform: translateY(110vh) rotate(0deg); }
      to { transform: translateY(-20vh) rotate(15deg); }
    }

    /* Main UI Container */
    .app {
      position: relative;
      z-index: 5;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .deck {
      position: relative;
      width: min(900px, 95vw);
      min-height: min(600px, 85vh);
      border-radius: 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: linear-gradient(145deg, rgba(255, 111, 181, 0.1), rgba(18, 0, 24, 0.6));
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Slides */
    .slide {
      position: absolute;
      inset: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: translateX(30px) scale(0.95);
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    /* Typography & Elements */
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 0.5rem; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
    h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 1rem; color: var(--gold); }
    p { font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.6; color: rgba(255, 244, 230, 0.9); max-width: 600px; }

    .btn {
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 0.5rem;
      position: relative;
      z-index: 10;
    }

    .btn:active { transform: scale(0.95); }

    .btn-primary {
      background: linear-gradient(135deg, var(--rose), var(--pink));
      color: white;
      box-shadow: 0 8px 24px rgba(255, 45, 117, 0.4);
    }
    
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 45, 117, 0.6); }

    .btn-gold {
      background: linear-gradient(135deg, #fff3b0, #ffd166);
      color: #3e1035;
      box-shadow: 0 8px 24px rgba(255, 209, 102, 0.3);
    }

    .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 209, 102, 0.5); }

    /* The Letter */
    .letter-container {
      background: rgba(255, 255, 255, 0.95);
      color: #3e1035;
      padding: clamp(1.5rem, 5vw, 3rem);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-width: 600px;
      transform: rotate(-1deg);
      position: relative;
    }
    
    .letter-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 6px;
      background: repeating-linear-gradient(45deg, var(--rose), var(--rose) 10px, transparent 10px, transparent 20px, #69a3ff 20px, #69a3ff 30px,
